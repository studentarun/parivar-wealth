name: Nightly prices & SIPs
on:
  schedule:
    - cron: '30 17 * * *'   # 11:00 PM IST - after AMFI publishes NAVs
    - cron: '30 2 * * *'    # 8:00 AM IST - catches late NAVs
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: parivar-wealth
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parivar-wealth/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/nightly.ts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # GitHub pauses scheduled jobs in repos with no commits for 60 days - keep it awake.
      - name: Keep-alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40*86400 )) ]; then
            git config user.name "parivar-bot"; git config user.email "bot@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive" && git push
          fi
